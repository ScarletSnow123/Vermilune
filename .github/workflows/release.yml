name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v1.2.20-beta'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish Vermilune.csproj -c Release -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -o publish

      - name: Prepare exe
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $tag = "${{ inputs.tag }}" }
          "TAG=$tag" >> $env:GITHUB_ENV

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "publish/Vermilune.exe" "dist/Vermilune.exe" -Force

          $notes = Join-Path $PWD "RELEASE_NOTES-$tag.md"
          if (!(Test-Path $notes)) {
            $notes = Join-Path $PWD "release-notes.md"
            "Vermilune $tag" | Set-Content $notes -Encoding UTF8
          }

          # Release 标题已经显示版本号，正文只保留分点，去掉 Markdown 一级标题。
          $body = Join-Path $PWD "dist\release-notes.md"
          $lines = @(Get-Content $notes -Encoding UTF8)
          if ($lines.Count -gt 0 -and $lines[0] -match '^#\s+') {
            $lines = @($lines | Select-Object -Skip 1)
          }
          while ($lines.Count -gt 0 -and [string]::IsNullOrWhiteSpace($lines[0])) {
            $lines = @($lines | Select-Object -Skip 1)
          }
          $lines | Set-Content $body -Encoding UTF8
          "NOTES=$body" >> $env:GITHUB_ENV
          Get-Item dist/Vermilune.exe | Select-Object Name, Length

      - name: Remove old release if exists
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "User-Agent" = "Vermilune"
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG"
          try {
            $release = Invoke-RestMethod -Uri $uri -Headers $headers
            Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -Headers $headers
            Start-Sleep -Seconds 2
            Write-Host "已删除旧 Release：$($release.id)"
          } catch {
            $status = $_.Exception.Response.StatusCode.value__
            if ($status -ne 404) { throw }
            Write-Host "没有旧 Release，继续创建。"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Vermilune ${{ env.TAG }}
          body_path: ${{ env.NOTES }}
          files: dist/Vermilune.exe
          draft: false
          prerelease: ${{ contains(env.TAG, 'beta') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
